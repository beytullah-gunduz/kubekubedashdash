name: Release

# Tag-driven release. Maintainer workflow:
#
#   git tag -a v1.0.0 -m "v1.0.0"
#   git push origin v1.0.0
#
# That's the entire release procedure. The tag is the single source of
# truth for the version — CI extracts it and passes it via -Papp.version.
# No version bumps in source files, no bot commits to main.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Prevent two concurrent tag pushes from racing on the GitHub Release.
# Do NOT cancel-in-progress: a re-tag should not kill an in-flight build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Force bash on every runner. windows-latest defaults to PowerShell, which
# splits `-Papp.version=1.0.0` at the dot and sends `.version=1.0.0` to
# Gradle as a task name. git-bash on Windows parses identically to Linux/macOS.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      # If macOS DMG fails, no point letting Linux/Windows litter half-baked
      # artifacts — the release is atomic.
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            task: packageReleaseDmg
            artifact-name: kubekubedashdash-macos
            artifact-glob: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: ubuntu-latest
            task: packageReleaseDeb
            artifact-name: kubekubedashdash-linux
            artifact-glob: composeApp/build/compose/binaries/main-release/deb/*.deb
          - os: windows-latest
            task: packageReleaseMsi
            artifact-name: kubekubedashdash-windows
            artifact-glob: composeApp/build/compose/binaries/main-release/msi/*.msi

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "21.0.12"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          # v6 moved caching into `gradle-actions-caching`, a proprietary
          # closed-source component governed by Gradle's commercial Terms of
          # Use rather than the MIT licence. `basic` is the open-source
          # provider (a thin wrapper over actions/cache). Keep this pinned
          # across Dependabot bumps — the default is `enhanced`.
          cache-provider: basic

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Verify formatting
        run: ./gradlew spotlessCheck

      # Release gate: never ship a tagged installer with red tests. The
      # matrix is fail-fast, so a test failure on any OS aborts the whole
      # release before any artifact is built — keeps the release atomic,
      # consistent with the fail-fast rationale documented above.
      - name: Run tests
        run: ./gradlew :composeApp:desktopTest

      # The Gradle console summary prints only the exception class and
      # file:line — the message string, which distinguishes fabric8's two
      # 10s shutdown awaits, lives only in the XML/HTML report. Upload it so
      # the next red run is diagnosable.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-report-${{ matrix.artifact-name }}
          path: |
            composeApp/build/reports/tests/desktopTest/**
            composeApp/build/test-results/desktopTest/**
          retention-days: 7
          if-no-files-found: ignore

      # Checks the ProGuard-shrunk jars before any installer is built: a bytecode
      # scan for calls the JVM verifier rejects, and a headless canary on the full
      # JDK and on the packaged runtime's module set. Same -Papp.version as the
      # packaging step, so proguardReleaseJars is UP-TO-DATE there and the
      # installer ships exactly the jars verified here.
      - name: Verify release build
        run: ./gradlew :composeApp:verifyReleaseBuild -Papp.version=${{ steps.version.outputs.version }}

      - name: Upload release canary logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-canary-logs-${{ matrix.artifact-name }}
          path: composeApp/build/release-canary/*/logs/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Build installer
        run: ./gradlew :composeApp:${{ matrix.task }} -Papp.version=${{ steps.version.outputs.version }}

      - name: Generate SHA256 checksum
        # macOS has `shasum -a 256` but no `sha256sum`. Linux has both.
        # Windows git-bash has `sha256sum` (coreutils) but no `shasum`.
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            HASH="sha256sum"
          else
            HASH="shasum -a 256"
          fi
          for f in ${{ matrix.artifact-glob }}; do
            $HASH "$f" > "$f.sha256"
          done

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-glob }}
            ${{ matrix.artifact-glob }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          files: artifacts/**
          # Fail loudly if a matrix job uploaded nothing — better than
          # silently shipping a partial release.
          fail_on_unmatched_files: true
          # v1.0.0 → false, v1.0.0-rc.1 → true. Auto-pre-release for
          # any tag containing a hyphen.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Points the Homebrew cask in beytullah-gunduz/homebrew-tap at this release so
  # `brew upgrade` picks it up. Runs after the release exists, so a failure here
  # never takes the release down with it. One-time setup (tap repo, deploy key,
  # secret) is in packaging/homebrew/README.md.
  homebrew:
    needs: release
    # Pre-releases stay out of the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Two tags released close together must not race on the tap's branch.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false

    steps:
      - name: Require the tap deploy key
        env:
          HAS_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set, so the tap still points at the previous release. See packaging/homebrew/README.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: packaging/homebrew

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: beytullah-gunduz/homebrew-tap
          # A deploy key with write access to the tap only — no token that can
          # reach any other repository.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # The checksum the build job published next to the DMG.
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "KubeKubeDashDash-$version.dmg.sha256" --dir sha
          sha256="$(cut -d' ' -f1 "sha/KubeKubeDashDash-$version.dmg.sha256")"

          cask=tap/Casks/kubekubedashdash.rb
          # Re-tagging an older version must not roll the tap back.
          if [ -f "$cask" ]; then
            current="$(sed -nE 's/^  version "([^"]+)"$/\1/p' "$cask")"
            newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)"
            if [ -n "$current" ] && [ "$newest" != "$version" ]; then
              echo "::notice::The tap already has $current, newer than $version. Left unchanged."
              exit 0
            fi
          fi

          mkdir -p tap/Casks
          packaging/homebrew/render-cask.sh "$version" "$sha256" > "$cask"
          ruby -c "$cask"

          cd tap
          if [ -z "$(git status --porcelain -- Casks)" ]; then
            echo "The tap already points at $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kubekubedashdash.rb
          git commit -m "chore(kubekubedashdash): update to $version"
          git push
