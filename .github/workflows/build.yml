name: Build and Test

# Per-push CI: lint, compile, run tests. Single Linux runner — packaging
# across macOS/Linux/Windows is exercised by .github/workflows/release.yml
# on every tag push, so there's no need to repeat it here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "21.0.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          # v6 moved caching into `gradle-actions-caching`, a proprietary
          # closed-source component governed by Gradle's commercial Terms of
          # Use rather than the MIT licence. `basic` is the open-source
          # provider (a thin wrapper over actions/cache). Keep this pinned
          # across Dependabot bumps — the default is `enhanced`.
          cache-provider: basic

      # Cheapest gate first — fail fast on formatting before paying for
      # compile time.
      - name: Verify formatting
        run: ./gradlew spotlessCheck

      - name: Compile
        run: ./gradlew :composeApp:compileKotlinDesktop

      - name: Run tests
        run: ./gradlew :composeApp:desktopTest

      # The Gradle console summary prints only the exception class and
      # file:line — the message string, which distinguishes fabric8's two
      # 10s shutdown awaits, lives only in the XML/HTML report. Upload it so
      # the next red run is diagnosable.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-report-${{ github.job }}-${{ runner.os }}
          path: |
            composeApp/build/reports/tests/desktopTest/**
            composeApp/build/test-results/desktopTest/**
          retention-days: 7
          if-no-files-found: ignore
