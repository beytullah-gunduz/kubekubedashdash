name: Build and Test

# Per-push CI: lint, compile, run tests. Single Linux runner — packaging
# across macOS/Linux/Windows is exercised by .github/workflows/release.yml
# on every tag push, so there's no need to repeat it here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: temurin
          java-version: "21.0.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Cheapest gate first — fail fast on formatting before paying for
      # compile time.
      - name: Verify formatting
        run: ./gradlew spotlessCheck

      - name: Compile
        run: ./gradlew :composeApp:compileKotlinDesktop

      - name: Run tests
        run: ./gradlew :composeApp:desktopTest

      # The Gradle console summary prints only the exception class and
      # file:line — the message string, which distinguishes fabric8's two
      # 10s shutdown awaits, lives only in the XML/HTML report. Upload it so
      # the next red run is diagnosable.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-${{ github.job }}-${{ runner.os }}
          path: |
            composeApp/build/reports/tests/desktopTest/**
            composeApp/build/test-results/desktopTest/**
          retention-days: 7
          if-no-files-found: ignore
